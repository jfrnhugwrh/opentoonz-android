# OpenToonz for Android - Gradle configuration.

# The native build is driven by CMake directly (see ../../CMakeLists.txt); the
# Android Gradle plugin never builds C++ itself, which keeps the build working
# with the exact Qt for Android kit the developer installed.
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
